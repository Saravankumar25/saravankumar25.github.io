<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="Full adder: two half sums plus carry"><title>Full adder: two half sums plus carry</title><defs><marker id="point" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" stroke="#aeb3bf" stroke-width="1.6" fill="none"/></marker></defs><rect width="900" height="460" rx="18" fill="#0d0e11"/><text x="40" y="48" fill="#dfe3e6" font-size="24" font-weight="600" font-family="system-ui">Full adder: two half sums plus carry</text><rect x="50" y="125" width="210" height="74" rx="11" fill="#13161a" stroke="#8bd8c9" stroke-width="1.5"/><text x="155.0" y="155" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">XOR 1</text><text x="155.0" y="176" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">P = A ⊕ B</text><rect x="330" y="125" width="210" height="74" rx="11" fill="#13161a" stroke="#8bd8c9" stroke-width="1.5"/><text x="435.0" y="155" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">XOR 2</text><text x="435.0" y="176" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">S = P ⊕ Cin</text><rect x="50" y="280" width="210" height="74" rx="11" fill="#13161a" stroke="#c7b7ff" stroke-width="1.5"/><text x="155.0" y="310" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">AND 1</text><text x="155.0" y="331" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">G = A ∧ B</text><rect x="330" y="280" width="210" height="74" rx="11" fill="#13161a" stroke="#c7b7ff" stroke-width="1.5"/><text x="435.0" y="310" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">AND 2</text><text x="435.0" y="331" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">H = P ∧ Cin</text><rect x="640" y="280" width="210" height="74" rx="11" fill="#13161a" stroke="#8bd8c9" stroke-width="1.5"/><text x="745.0" y="310" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">OR</text><text x="745.0" y="331" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">Carry = G ∨ H</text><path d="M260 163L327 163" fill="none" stroke="#aeb3bf" stroke-width="2.4" marker-end="url(#point)"/><path d="M540 163L623 163" fill="none" stroke="#aeb3bf" stroke-width="2.4" marker-end="url(#point)"/><text x="641" y="169" text-anchor="start" font-size="18" font-family="system-ui" fill="#8bd8c9">SUM</text><path d="M260 316L327 316" fill="none" stroke="#aeb3bf" stroke-width="2.4" marker-end="url(#point)"/><path d="M540 316L637 316" fill="none" stroke="#aeb3bf" stroke-width="2.4" marker-end="url(#point)"/><text x="28" y="117" text-anchor="start" font-size="15" font-family="system-ui" fill="#dfe3e6">A,B</text><text x="292" y="118" text-anchor="start" font-size="15" font-family="system-ui" fill="#dfe3e6">Cin</text><text x="53" y="264" text-anchor="start" font-size="15" font-family="system-ui" fill="#dfe3e6">A,B</text><text x="330" y="265" text-anchor="start" font-size="15" font-family="system-ui" fill="#dfe3e6">P,Cin</text><text x="440" y="415" text-anchor="middle" font-size="19" font-family="system-ui" fill="#dfe3e6">S = A ⊕ B ⊕ Cin       Carry = AB + Cin(A ⊕ B)</text></svg>