<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="UML sequence: one RAM read"><title>UML sequence: one RAM read</title><defs><marker id="point" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" stroke="#aeb3bf" stroke-width="1.6" fill="none"/></marker></defs><rect width="900" height="470" rx="18" fill="#0d0e11"/><text x="40" y="48" fill="#dfe3e6" font-size="24" font-weight="600" font-family="system-ui">UML sequence: one RAM read</text><rect x="20" y="92" width="145" height="53" rx="11" fill="#13161a" stroke="#8bd8c9" stroke-width="1.5"/><text x="92.5" y="122" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">CPU</text><path d="M90 145L90 425" stroke="#424752" stroke-dasharray="5 7" stroke-width="2"/><rect x="240" y="92" width="145" height="53" rx="11" fill="#13161a" stroke="#424752" stroke-width="1.5"/><text x="312.5" y="122" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">Address bus</text><path d="M310 145L310 425" stroke="#424752" stroke-dasharray="5 7" stroke-width="2"/><rect x="460" y="92" width="145" height="53" rx="11" fill="#13161a" stroke="#424752" stroke-width="1.5"/><text x="532.5" y="122" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">RAM decoder</text><path d="M530 145L530 425" stroke="#424752" stroke-dasharray="5 7" stroke-width="2"/><rect x="690" y="92" width="145" height="53" rx="11" fill="#13161a" stroke="#424752" stroke-width="1.5"/><text x="762.5" y="122" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">Selected byte</text><path d="M760 145L760 425" stroke="#424752" stroke-dasharray="5 7" stroke-width="2"/><path d="M90 184L310 184" fill="none" stroke="#aeb3bf" stroke-width="2.4" marker-end="url(#point)"/><text x="200.0" y="173" text-anchor="middle" font-size="13" font-family="system-ui" fill="#dfe3e6">1. address = 3</text><path d="M310 238L530 238" fill="none" stroke="#aeb3bf" stroke-width="2.4" marker-end="url(#point)"/><text x="420.0" y="227" text-anchor="middle" font-size="13" font-family="system-ui" fill="#dfe3e6">2. select row 3</text><path d="M530 290L760 290" fill="none" stroke="#aeb3bf" stroke-width="2.4" marker-end="url(#point)"/><text x="645.0" y="279" text-anchor="middle" font-size="13" font-family="system-ui" fill="#dfe3e6">3. read cell</text><path d="M760 360L90 360" fill="none" stroke="#8bd8c9" stroke-width="2.4" marker-end="url(#point)"/><text x="425.0" y="349" text-anchor="middle" font-size="13" font-family="system-ui" fill="#dfe3e6">4. return 8-bit data</text><text x="450" y="448" text-anchor="middle" font-size="15" font-family="system-ui" fill="#aeb3bf">A read does not change stored data. A write uses a data value and write-enable.</text></svg>