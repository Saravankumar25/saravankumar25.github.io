<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="Instruction encoding: opcode + operand"><title>Instruction encoding: opcode + operand</title><defs><marker id="point" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" stroke="#aeb3bf" stroke-width="1.6" fill="none"/></marker></defs><rect width="900" height="460" rx="18" fill="#0d0e11"/><text x="40" y="48" fill="#dfe3e6" font-size="24" font-weight="600" font-family="system-ui">Instruction encoding: opcode + operand</text><text x="60" y="97" text-anchor="start" font-size="19" font-family="system-ui" fill="#dfe3e6">Example: LOAD address 3 in one 8-bit toy instruction</text><rect x="67" y="132" width="80" height="95" rx="11" fill="#13161a" stroke="#8bd8c9" stroke-width="1.5"/><text x="107.0" y="162" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">0</text><text x="107.0" y="183" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">bit 7</text><rect x="163" y="132" width="80" height="95" rx="11" fill="#13161a" stroke="#8bd8c9" stroke-width="1.5"/><text x="203.0" y="162" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">0</text><text x="203.0" y="183" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">bit 6</text><rect x="259" y="132" width="80" height="95" rx="11" fill="#13161a" stroke="#8bd8c9" stroke-width="1.5"/><text x="299.0" y="162" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">0</text><text x="299.0" y="183" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">bit 5</text><rect x="355" y="132" width="80" height="95" rx="11" fill="#13161a" stroke="#8bd8c9" stroke-width="1.5"/><text x="395.0" y="162" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">1</text><text x="395.0" y="183" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">bit 4</text><rect x="451" y="132" width="80" height="95" rx="11" fill="#13161a" stroke="#c7b7ff" stroke-width="1.5"/><text x="491.0" y="162" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">0</text><text x="491.0" y="183" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">bit 3</text><rect x="547" y="132" width="80" height="95" rx="11" fill="#13161a" stroke="#c7b7ff" stroke-width="1.5"/><text x="587.0" y="162" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">0</text><text x="587.0" y="183" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">bit 2</text><rect x="643" y="132" width="80" height="95" rx="11" fill="#13161a" stroke="#c7b7ff" stroke-width="1.5"/><text x="683.0" y="162" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">1</text><text x="683.0" y="183" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">bit 1</text><rect x="739" y="132" width="80" height="95" rx="11" fill="#13161a" stroke="#c7b7ff" stroke-width="1.5"/><text x="779.0" y="162" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">1</text><text x="779.0" y="183" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">bit 0</text><text x="255" y="281" text-anchor="middle" font-size="18" font-family="system-ui" fill="#8bd8c9">0001 = LOAD opcode</text><text x="653" y="281" text-anchor="middle" font-size="18" font-family="system-ui" fill="#c7b7ff">0011 = address 3</text><path d="M105 302L392 302" fill="none" stroke="#8bd8c9" stroke-width="2.4" /><path d="M488 302L774 302" fill="none" stroke="#c7b7ff" stroke-width="2.4" /><text x="440" y="352" text-anchor="middle" font-size="20" font-family="system-ui" fill="#dfe3e6">Instruction register = 0001 0011</text><text x="440" y="402" text-anchor="middle" font-size="15" font-family="system-ui" fill="#aeb3bf">The CPU gives meaning to the two fields according to its ISA.</text></svg>