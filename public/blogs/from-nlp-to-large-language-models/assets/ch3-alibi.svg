<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img"><rect width="900" height="470" fill="#111113"/><text x="34.0" y="44.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#f1f1f3" fill-opacity="1">ALiBi: a distance penalty added to the attention scores</text>
<text x="34.0" y="70.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#a9a9b3" fill-opacity="1">score(m, n) = q·k / √d_k  +  μ·(n − m),   μ &lt; 0   — the farther back the key, the bigger the penalty</text>
