<text x="450.0" y="340.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#a9a9b3" fill-opacity="1">queries are short questions; documents are long statements — HyDE bridges the style gap</text>
