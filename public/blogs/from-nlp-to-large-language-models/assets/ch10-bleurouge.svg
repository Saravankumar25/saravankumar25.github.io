<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"><rect width="900" height="420" fill="#111113"/><text x="34.0" y="44.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#f1f1f3" fill-opacity="1">BLEU asks about precision, ROUGE about recall</text>
<text x="34.0" y="70.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#a9a9b3" fill-opacity="1">which n-grams match between the candidate and the reference?</text>
<rect x="40.0" y="95.0" width="380.0" height="260.0" rx="12" fill="#19191d" fill-opacity="1" stroke="#2c2c33" stroke-width="1"/>
<text x="230.0" y="125.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="bold" fill="#e3b869" fill-opacity="1">BLEU (translation)</text>
<text x="230.0" y="165.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#f1f1f3" fill-opacity="1">of the n-grams in the PREDICTION,</text>
<text x="230.0" y="184.5" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#f1f1f3" fill-opacity="1">how many appear in the reference?</text>
<text x="230.0" y="235.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">precision-focused → needs a brevity penalty</text>
<text x="230.0" y="275.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#e3b869" fill-opacity="1">BP = min(1, e^(1 − r/c))</text>
<text x="230.0" y="320.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">a very short, safe output cannot cheat</text>
<rect x="480.0" y="95.0" width="380.0" height="260.0" rx="12" fill="#19191d" fill-opacity="1" stroke="#2c2c33" stroke-width="1"/>
<text x="670.0" y="125.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="bold" fill="#84c3bb" fill-opacity="1">ROUGE (summarisation)</text>
<text x="670.0" y="165.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#f1f1f3" fill-opacity="1">of the n-grams in the REFERENCE,</text>
<text x="670.0" y="184.5" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#f1f1f3" fill-opacity="1">how many appear in the prediction?</text>
<text x="670.0" y="235.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">recall-focused → did we cover the reference?</text>
<text x="670.0" y="275.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#84c3bb" fill-opacity="1">ROUGE-N, ROUGE-L (longest common subsequence)</text>
<text x="670.0" y="320.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">METEOR adds recall, stems and word order</text>
<text x="450.0" y="395.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#f1f1f3" fill-opacity="1">all three count surface overlap — they miss paraphrases that mean the same thing</text></svg>