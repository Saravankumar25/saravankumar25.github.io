<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img"><rect width="900" height="360" fill="#111113"/><text x="34.0" y="44.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#f1f1f3" fill-opacity="1">Self-attention cannot see order</text>
<text x="34.0" y="70.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#a9a9b3" fill-opacity="1">"dog bites man" and "man bites dog" contain exactly the same three vectors</text>
<rect x="60.0" y="100.0" width="110.0" height="44.0" rx="8" fill="#202026" fill-opacity="1" stroke="#84c3bb" stroke-width="1.8"/>
<text x="115.0" y="128.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#f1f1f3" fill-opacity="1">dog</text>
<rect x="190.0" y="100.0" width="110.0" height="44.0" rx="8" fill="#202026" fill-opacity="1" stroke="#84c3bb" stroke-width="1.8"/>
<text x="245.0" y="128.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#f1f1f3" fill-opacity="1">bites</text>
<rect x="320.0" y="100.0" width="110.0" height="44.0" rx="8" fill="#202026" fill-opacity="1" stroke="#84c3bb" stroke-width="1.8"/>
<text x="375.0" y="128.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#f1f1f3" fill-opacity="1">man</text>
<rect x="60.0" y="190.0" width="110.0" height="44.0" rx="8" fill="#202026" fill-opacity="1" stroke="#e3b869" stroke-width="1.8"/>
<text x="115.0" y="218.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#f1f1f3" fill-opacity="1">man</text>
<rect x="190.0" y="190.0" width="110.0" height="44.0" rx="8" fill="#202026" fill-opacity="1" stroke="#e3b869" stroke-width="1.8"/>
<text x="245.0" y="218.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#f1f1f3" fill-opacity="1">bites</text>
<rect x="320.0" y="190.0" width="110.0" height="44.0" rx="8" fill="#202026" fill-opacity="1" stroke="#e3b869" stroke-width="1.8"/>
<text x="375.0" y="218.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#f1f1f3" fill-opacity="1">dog</text>
<text x="520.0" y="128.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#a9a9b3" fill-opacity="1">→  same vectors, same blend for each</text>
<text x="520.0" y="218.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#a9a9b3" fill-opacity="1">→  rows simply come out in another order</text>
<text x="450.0" y="300.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#e08fa3" fill-opacity="1">without extra information the model literally cannot tell the two sentences apart</text>
<text x="450.0" y="328.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#f1f1f3" fill-opacity="1">fix: add a position vector p_m to every token embedding (positional encoding)</text></svg>