<text x="60.0" y="380.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" fill="#a9a9b3" fill-opacity="1">Generation:  start fully masked → predict → keep confident tokens → re-mask the rest → repeat</text>
<text x="60.0" y="408.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" fill="#a9a9b3" fill-opacity="1">Pros: fewer passes than tokens · sees the whole sequence (fill-in-the-middle)     Cons: lags the best AR models; less AR-era tooling</text></svg>