<text x="60.0" y="148.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#f1f1f3" fill-opacity="1">[BOS]  A  cute  teddy bear  is  reading  .  [EOS]</text>
<line x1="450.0" y1="162.0" x2="450.0" y2="178.0" stroke="#9a9aa5" stroke-width="1.8" marker-end="url(#m9a9aa5)"/>
