<text x="60.0" y="460.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#f1f1f3" fill-opacity="1">[0.001, 0.0003, … , 0.4 , … , 0.002]  → pick "Un"</text>
