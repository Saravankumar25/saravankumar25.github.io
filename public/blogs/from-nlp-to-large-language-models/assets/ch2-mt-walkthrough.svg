<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img"><rect width="900" height="640" fill="#111113"/><defs><marker id="m9a9aa5" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#9a9aa5"/></marker></defs>
<text x="34.0" y="44.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#f1f1f3" fill-opacity="1">One sentence through the Transformer</text>
<text x="34.0" y="70.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#a9a9b3" fill-opacity="1">"A cute teddy bear is reading."  →  "Un ours en peluche mignon lit."</text>
<rect x="40.0" y="100.0" width="820.0" height="62.0" rx="12" fill="#19191d" fill-opacity="1" stroke="#8fb4f5" stroke-width="2"/>
