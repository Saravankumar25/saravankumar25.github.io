<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img"><rect width="900" height="430" fill="#111113"/><defs><marker id="m9a9aa5" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#9a9aa5"/></marker></defs>
<text x="34.0" y="44.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#f1f1f3" fill-opacity="1">The 3-step tool-calling flow</text>
<text x="34.0" y="70.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#a9a9b3" fill-opacity="1">the LLM never executes anything — execution happens in ordinary application code</text>
<rect x="30.0" y="100.0" width="270.0" height="270.0" rx="12" fill="#202026" fill-opacity="1" stroke="#84c3bb" stroke-width="2"/>
<text x="165.0" y="130.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#a9a9b3" fill-opacity="1">STEP 1</text>
<text x="165.0" y="156.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="bold" fill="#84c3bb" fill-opacity="1">LLM predicts the arguments</text>
<rect x="44.0" y="185.0" width="242.0" height="110.0" rx="8" fill="#19191d" fill-opacity="1" stroke="#33333a" stroke-width="1"/>
<text x="165.0" y="232.0" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="11" font-weight="normal" fill="#f1f1f3" fill-opacity="1">{"tool": "find_teddy_bear",</text>
<text x="165.0" y="248.5" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="11" font-weight="normal" fill="#f1f1f3" fill-opacity="1">"arguments": {"location":</text>
<text x="165.0" y="265.0" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="11" font-weight="normal" fill="#f1f1f3" fill-opacity="1"> [37.43, −122.17]}}</text>
<line x1="302.0" y1="235.0" x2="323.0" y2="235.0" stroke="#9a9aa5" stroke-width="2" marker-end="url(#m9a9aa5)"/>
<rect x="325.0" y="100.0" width="270.0" height="270.0" rx="12" fill="#202026" fill-opacity="1" stroke="#e3b869" stroke-width="2"/>
<text x="460.0" y="130.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#a9a9b3" fill-opacity="1">STEP 2</text>
<text x="460.0" y="156.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="bold" fill="#e3b869" fill-opacity="1">Application EXECUTES the function</text>
<rect x="339.0" y="185.0" width="242.0" height="110.0" rx="8" fill="#19191d" fill-opacity="1" stroke="#33333a" stroke-width="1"/>
<text x="460.0" y="232.0" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="11" font-weight="normal" fill="#f1f1f3" fill-opacity="1">{"name": "Cuddly",</text>
<text x="460.0" y="248.5" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="11" font-weight="normal" fill="#f1f1f3" fill-opacity="1">"distance_meters": 150.0,</text>
<text x="460.0" y="265.0" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="11" font-weight="normal" fill="#f1f1f3" fill-opacity="1">"mood": "happy"}</text>
<line x1="597.0" y1="235.0" x2="618.0" y2="235.0" stroke="#9a9aa5" stroke-width="2" marker-end="url(#m9a9aa5)"/>
<rect x="620.0" y="100.0" width="270.0" height="270.0" rx="12" fill="#202026" fill-opacity="1" stroke="#a3d68f" stroke-width="2"/>
<text x="755.0" y="130.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#a9a9b3" fill-opacity="1">STEP 3</text>
<text x="755.0" y="156.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="bold" fill="#a3d68f" fill-opacity="1">LLM writes the final answer</text>
<rect x="634.0" y="185.0" width="242.0" height="110.0" rx="8" fill="#19191d" fill-opacity="1" stroke="#33333a" stroke-width="1"/>
<text x="755.0" y="232.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#f1f1f3" fill-opacity="1">“Cuddly is happy and only</text>
<text x="755.0" y="250.8" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#f1f1f3" fill-opacity="1">150 meters away!”</text>
<text x="450.0" y="405.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#a9a9b3" fill-opacity="1">the model only needs to produce correct arguments — it does not need to know what the function does inside</text></svg>