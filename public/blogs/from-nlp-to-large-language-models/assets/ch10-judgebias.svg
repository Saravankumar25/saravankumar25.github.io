<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img"><rect width="900" height="400" fill="#111113"/><text x="34.0" y="44.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#f1f1f3" fill-opacity="1">Three biases that break LLM-as-a-judge</text>
<text x="34.0" y="70.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#a9a9b3" fill-opacity="1">and the standard remedy for each</text>
<rect x="30.0" y="95.0" width="270.0" height="270.0" rx="12" fill="#202026" fill-opacity="1" stroke="#e08fa3" stroke-width="2"/>
<text x="165.0" y="128.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15.5" font-weight="bold" fill="#e08fa3" fill-opacity="1">Position bias</text>
<text x="165.0" y="168.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="11.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">problem</text>
<text x="165.0" y="198.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#f1f1f3" fill-opacity="1">prefers whichever answer</text>
<text x="165.0" y="216.1" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#f1f1f3" fill-opacity="1">appears first (or last)</text>
<text x="165.0" y="262.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="11.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">remedy</text>
<text x="165.0" y="292.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a3d68f" fill-opacity="1">swap the order, ask twice,</text>
<text x="165.0" y="310.1" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a3d68f" fill-opacity="1">take the majority vote</text>
<rect x="325.0" y="95.0" width="270.0" height="270.0" rx="12" fill="#202026" fill-opacity="1" stroke="#e3b869" stroke-width="2"/>
<text x="460.0" y="128.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15.5" font-weight="bold" fill="#e3b869" fill-opacity="1">Verbosity bias</text>
<text x="460.0" y="168.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="11.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">problem</text>
<text x="460.0" y="198.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#f1f1f3" fill-opacity="1">prefers longer, more</text>
<text x="460.0" y="216.1" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#f1f1f3" fill-opacity="1">elaborate answers</text>
<text x="460.0" y="262.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="11.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">remedy</text>
<text x="460.0" y="292.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a3d68f" fill-opacity="1">explicit “ignore length”,</text>
<text x="460.0" y="310.1" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a3d68f" fill-opacity="1">few-shot examples,</text>
<text x="460.0" y="328.2" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a3d68f" fill-opacity="1">length penalty</text>
<rect x="620.0" y="95.0" width="270.0" height="270.0" rx="12" fill="#202026" fill-opacity="1" stroke="#b9a3f2" stroke-width="2"/>
<text x="755.0" y="128.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15.5" font-weight="bold" fill="#b9a3f2" fill-opacity="1">Self-enhancement bias</text>
<text x="755.0" y="168.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="11.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">problem</text>
<text x="755.0" y="198.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#f1f1f3" fill-opacity="1">prefers its own outputs,</text>
<text x="755.0" y="216.1" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#f1f1f3" fill-opacity="1">even when not better</text>
<text x="755.0" y="262.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="11.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">remedy</text>
<text x="755.0" y="292.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a3d68f" fill-opacity="1">judge with a different,</text>
<text x="755.0" y="310.1" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a3d68f" fill-opacity="1">stronger model</text></svg>