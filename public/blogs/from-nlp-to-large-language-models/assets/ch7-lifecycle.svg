<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img"><rect width="900" height="470" fill="#111113"/><defs><marker id="m9a9aa5" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#9a9aa5"/></marker></defs>
<text x="34.0" y="44.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#f1f1f3" fill-opacity="1">The three stages of a modern LLM</text>
<text x="34.0" y="70.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#a9a9b3" fill-opacity="1">pretraining → supervised finetuning → preference tuning; stages 2 + 3 together are called alignment</text>
<rect x="60.0" y="95.0" width="700.0" height="90.0" rx="12" fill="#202026" fill-opacity="1" stroke="#8fb4f5" stroke-width="2"/>
<text x="80.0" y="123.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="bold" fill="#8fb4f5" fill-opacity="1">Stage 1 · Pretraining</text>
<text x="80.0" y="148.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#f1f1f3" fill-opacity="1">objective: next-token prediction on trillions of tokens</text>
<text x="80.0" y="169.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">you get: broad knowledge of language, code, facts</text>
<line x1="450.0" y1="185.0" x2="450.0" y2="210.0" stroke="#9a9aa5" stroke-width="2" marker-end="url(#m9a9aa5)"/>
<rect x="60.0" y="210.0" width="700.0" height="90.0" rx="12" fill="#202026" fill-opacity="1" stroke="#e3b869" stroke-width="2"/>
<text x="80.0" y="238.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="bold" fill="#e3b869" fill-opacity="1">Stage 2 · Supervised finetuning (SFT)</text>
<text x="80.0" y="263.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#f1f1f3" fill-opacity="1">objective: next-token prediction on (prompt, response) pairs; loss on response tokens only</text>
<text x="80.0" y="284.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">you get: follows instructions and responds</text>
<line x1="450.0" y1="300.0" x2="450.0" y2="325.0" stroke="#9a9aa5" stroke-width="2" marker-end="url(#m9a9aa5)"/>
<rect x="60.0" y="325.0" width="700.0" height="90.0" rx="12" fill="#202026" fill-opacity="1" stroke="#e08fa3" stroke-width="2"/>
<text x="80.0" y="353.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="bold" fill="#e08fa3" fill-opacity="1">Stage 3 · Preference tuning (RLHF / DPO)</text>
<text x="80.0" y="378.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#f1f1f3" fill-opacity="1">objective: learn from human preference comparisons</text>
<text x="80.0" y="399.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">you get: helpful, honest and safe</text>
<path d="M775,185 L800,185 L800,395 L775,395" stroke="#9a9aa5" stroke-width="1.6" fill="none" fill-opacity="1"/>
<text x="812.0" y="290.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#9a9aa5" fill-opacity="1">alignment</text></svg>