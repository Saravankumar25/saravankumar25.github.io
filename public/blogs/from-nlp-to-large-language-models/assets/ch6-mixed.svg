<text x="34.0" y="44.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#f1f1f3" fill-opacity="1">Mixed-precision training</text>
<text x="34.0" y="70.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#a9a9b3" fill-opacity="1">compute in 16 bits for speed; keep the master copy and Adam moments in FP32</text>
