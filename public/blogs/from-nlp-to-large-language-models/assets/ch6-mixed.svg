<text x="450.0" y="408.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">tiny updates (≈10⁻⁷) would round to zero in 16-bit, hence the FP32 master copy</text></svg>