<rect x="360.0" y="200.0" width="140.0" height="60.0" rx="8" fill="#202026" fill-opacity="1" stroke="#555566" stroke-width="1.4"/>
<text x="430.0" y="237.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#f1f1f3" fill-opacity="1">45</text>
<text x="530.0" y="237.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#a9a9b3" fill-opacity="1">50</text>
<rect x="220.0" y="200.0" width="140.0" height="60.0" rx="8" fill="#202026" fill-opacity="1" stroke="#555566" stroke-width="1.4"/>
<rect x="220.0" y="200.0" width="140.0" height="60.0" rx="8" fill="#202026" fill-opacity="1" stroke="#e08fa3" stroke-width="1.4"/>
<rect x="360.0" y="200.0" width="140.0" height="60.0" rx="8" fill="#202026" fill-opacity="1" stroke="#a3d68f" stroke-width="2"/>
<text x="290.0" y="237.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#e08fa3" fill-opacity="1">5</text>
<text x="430.0" y="237.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#a3d68f" fill-opacity="1">45</text>
<text x="290.0" y="285.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#a9a9b3" fill-opacity="1">45</text>
<text x="430.0" y="285.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#a9a9b3" fill-opacity="1">55</text>
<text x="640.0" y="150.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#f1f1f3" fill-opacity="1">p_o = (40 + 45)/100 = 0.85</text>
<text x="640.0" y="185.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#f1f1f3" fill-opacity="1">p_e = 0.5·0.45 + 0.5·0.55 = 0.50</text>
<text x="640.0" y="225.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13.5" font-weight="normal" fill="#e3b869" fill-opacity="1">κ = (p_o − p_e) / (1 − p_e)</text>
<text x="640.0" y="255.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="bold" fill="#e3b869" fill-opacity="1">  = 0.35 / 0.50 = 0.70</text>
<text x="640.0" y="290.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">“substantial agreement”</text>
<text x="450.0" y="355.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13.5" font-weight="normal" fill="#f1f1f3" fill-opacity="1">κ = 1 perfect · κ = 0 chance level · κ &lt; 0 worse than chance</text>
<text x="450.0" y="385.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12.5" font-weight="normal" fill="#a9a9b3" fill-opacity="1">two raters flipping coins still agree 50% of the time — raw agreement hides this</text></svg>