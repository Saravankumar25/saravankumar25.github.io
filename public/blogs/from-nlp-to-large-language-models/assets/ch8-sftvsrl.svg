<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img"><rect width="900" height="290" fill="#111113"/><text x="34.0" y="44.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#f1f1f3" fill-opacity="1">Two ways to teach reasoning</text>
<text x="34.0" y="70.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#a9a9b3" fill-opacity="1">RL lets the model discover its own chains and has a natural automatic reward</text>
<rect x="30.0" y="90.0" width="400.0" height="170.0" rx="12" fill="#19191d" fill-opacity="1" stroke="#2c2c33" stroke-width="1"/>
<text x="230.0" y="118.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="bold" fill="#e08fa3" fill-opacity="1">Option A · SFT on human chains</text>
<text x="60.0" y="160.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#f1f1f3" fill-opacity="1">✗  extremely expensive (a PhD per chain)</text>
<text x="60.0" y="184.7" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#f1f1f3" fill-opacity="1">✗  caps the model at human styles</text>
<text x="60.0" y="209.4" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#f1f1f3" fill-opacity="1">✗  millions of examples needed</text>
<rect x="470.0" y="90.0" width="400.0" height="170.0" rx="12" fill="#19191d" fill-opacity="1" stroke="#2c2c33" stroke-width="1"/>
<text x="670.0" y="118.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="bold" fill="#84c3bb" fill-opacity="1">Option B · Reinforcement learning</text>
<text x="500.0" y="160.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#f1f1f3" fill-opacity="1">✓  model generates its own chains</text>
<text x="500.0" y="184.7" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#f1f1f3" fill-opacity="1">✓  can exceed human reasoning</text>
<text x="500.0" y="209.4" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#f1f1f3" fill-opacity="1">✓  verifiable reward: answer / tests</text>
<text x="670.0" y="240.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="bold" fill="#84c3bb" fill-opacity="1">verdict: use RL</text></svg>