<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"><rect width="900" height="420" fill="#111113"/><defs><marker id="m9a9aa5" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#9a9aa5"/></marker></defs>
