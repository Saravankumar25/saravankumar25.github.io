<text x="828.0" y="197.6" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" fill="#a9a9b3" fill-opacity="1">per token</text>
<text x="450.0" y="290.0" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="22" font-weight="normal" fill="#f1f1f3" fill-opacity="1">Attention(Q, K, V) = softmax( Q Kᵀ / √d_k ) V</text>
<text x="450.0" y="335.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#a9a9b3" fill-opacity="1">every row of the result is computed at the same time: that is the parallelism RNNs lacked</text></svg>