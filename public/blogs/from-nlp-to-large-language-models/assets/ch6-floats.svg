<text x="120.0" y="337.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" fill="#a9a9b3" fill-opacity="1">max ≈ 65,504  (narrow range)</text>
<text x="450.0" y="375.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="13.5" font-weight="normal" fill="#f1f1f3" fill-opacity="1">BF16 keeps FP32’s range with fewer precision bits — the preferred format for training</text></svg>