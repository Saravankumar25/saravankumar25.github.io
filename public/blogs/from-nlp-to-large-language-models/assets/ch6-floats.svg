<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img"><rect width="900" height="400" fill="#111113"/><text x="34.0" y="44.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#f1f1f3" fill-opacity="1">Floating-point formats: sign | exponent | mantissa</text>
