<text x="199.0" y="215.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" fill="#e3b869" fill-opacity="1">exponent 8</text>
<rect x="263.0" y="190.0" width="105.0" height="40.0" rx="2" fill="#202026" fill-opacity="1" stroke="#e08fa3" stroke-width="1.8"/>
