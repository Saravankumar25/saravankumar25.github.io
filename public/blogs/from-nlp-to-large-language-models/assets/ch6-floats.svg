<text x="40.0" y="216.0" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="bold" fill="#f1f1f3" fill-opacity="1">BF16</text>
