<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="Why 1011 means eleven"><title>Why 1011 means eleven</title><defs><marker id="point" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" stroke="#aeb3bf" stroke-width="1.6" fill="none"/></marker></defs><rect width="900" height="460" rx="18" fill="#0d0e11"/><text x="40" y="48" fill="#dfe3e6" font-size="24" font-weight="600" font-family="system-ui">Why 1011 means eleven</text><text x="50" y="94" text-anchor="start" font-size="20" font-family="system-ui" fill="#dfe3e6">Binary value: 1 0 1 1</text><rect x="60" y="125" width="166" height="145" rx="11" fill="#13161a" stroke="#8bd8c9" stroke-width="1.5"/><text x="143.0" y="155" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">1</text><text x="143.0" y="176" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">weight 8</text><text x="143" y="309" text-anchor="middle" font-size="17" font-family="system-ui" fill="#dfe3e6">1 × 8 = 8</text><rect x="265" y="125" width="166" height="145" rx="11" fill="#13161a" stroke="#424752" stroke-width="1.5"/><text x="348.0" y="155" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">0</text><text x="348.0" y="176" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">weight 4</text><text x="348" y="309" text-anchor="middle" font-size="17" font-family="system-ui" fill="#dfe3e6">0 × 4 = 0</text><rect x="470" y="125" width="166" height="145" rx="11" fill="#13161a" stroke="#8bd8c9" stroke-width="1.5"/><text x="553.0" y="155" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">1</text><text x="553.0" y="176" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">weight 2</text><text x="553" y="309" text-anchor="middle" font-size="17" font-family="system-ui" fill="#dfe3e6">1 × 2 = 2</text><rect x="675" y="125" width="166" height="145" rx="11" fill="#13161a" stroke="#8bd8c9" stroke-width="1.5"/><text x="758.0" y="155" text-anchor="middle" font-size="16" font-family="system-ui" fill="#dfe3e6">1</text><text x="758.0" y="176" text-anchor="middle" font-size="12" font-family="system-ui" fill="#aeb3bf">weight 1</text><text x="758" y="309" text-anchor="middle" font-size="17" font-family="system-ui" fill="#dfe3e6">1 × 1 = 1</text><text x="440" y="375" text-anchor="middle" font-size="23" font-family="system-ui" fill="#8bd8c9">8 + 0 + 2 + 1 = 11 in decimal</text><text x="440" y="414" text-anchor="middle" font-size="15" font-family="system-ui" fill="#aeb3bf">Moving one place left doubles the value of that column.</text></svg>